<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1030" width="800" height="1030" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Qué hacer si encuentras una camada</title>
  <desc id="d">Árbol de decisión. Al encontrar una camada: no tocarla ni moverla y observar de lejos unas horas. ¿Vuelve la madre? Si no vuelve, avisar enseguida porque es urgente: con menos de 4 semanas necesitan calor y alimentación frecuente en una casa de acogida. Si vuelve, según la edad: menos de 6 semanas, se quedan con la madre; de 6 a 8 semanas, retirar para adopción; de 2 a 4 meses, valorar con el programa la adopción si se dejan tocar; más de 4 meses sin contacto con personas, CER y retorno. Avisar siempre al ayuntamiento o al programa, anotarlo en el censo y planificar el CER de la madre. Elaboración propia, CC BY-SA 4.0.</desc>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#444"/></marker>
  </defs>
  <rect width="800" height="1030" fill="#ffffff"/>
  <text x="400" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#2f6b4f">He encontrado una camada</text>
  <text x="400" y="80" text-anchor="middle" font-size="20" fill="#444">Qué hacer paso a paso</text>

  <g transform="translate(30,104)">
    <rect width="740" height="96" rx="14" fill="#eaf3ee" stroke="#2f6b4f" stroke-width="2.5"/>
    <text x="370" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#2f6b4f">1. No la toques ni la muevas</text>
    <text x="370" y="72" text-anchor="middle" font-size="19" fill="#444">Obsérvala de lejos durante unas horas: la madre suele ir y volver.</text>
  </g>
  <path d="M230 202 L230 238" stroke="#444" stroke-width="4" marker-end="url(#f)"/>

  <!-- pregunta -->
  <path d="M230 244 L420 322 L230 400 L40 322 Z" fill="#ffffff" stroke="#2f6b4f" stroke-width="3"/>
  <text x="230" y="316" text-anchor="middle" font-size="22" font-weight="700" fill="#2f6b4f">2. ¿Vuelve</text>
  <text x="230" y="344" text-anchor="middle" font-size="22" font-weight="700" fill="#2f6b4f">la madre?</text>

  <!-- NO -->
  <path d="M420 322 L470 322" stroke="#444" stroke-width="4" marker-end="url(#f)"/>
  <text x="436" y="310" font-size="18" font-weight="700" fill="#b3261e">NO</text>
  <g transform="translate(476,236)">
    <rect width="294" height="200" rx="12" fill="#fdecea" stroke="#b3261e" stroke-width="2.5"/>
    <text x="16" y="34" font-size="21" font-weight="700" fill="#b3261e">✗ Sin madre: urgente</text>
    <text x="16" y="66" font-size="18" fill="#444">Avisa enseguida.</text>
    <text x="16" y="94" font-size="18" fill="#444">Con menos de 4 semanas</text>
    <text x="16" y="120" font-size="18" fill="#444">necesitan calor y comida</text>
    <text x="16" y="146" font-size="18" fill="#444">cada pocas horas: casa</text>
    <text x="16" y="172" font-size="18" fill="#444">de acogida.</text>
  </g>

  <!-- SÍ -->
  <path d="M230 400 L230 464" stroke="#444" stroke-width="4" marker-end="url(#f)"/>
  <text x="244" y="440" font-size="18" font-weight="700" fill="#2f6b4f">SÍ</text>
  <text x="30" y="500" font-size="22" font-weight="700" fill="#2f6b4f">3. Calcula su edad aproximada</text>

  <g transform="translate(30,520)">
    <rect width="740" height="78" rx="12" fill="#ffffff" stroke="#2f6b4f" stroke-width="2"/>
    <rect width="190" height="78" rx="12" fill="#2f6b4f"/><rect x="170" width="20" height="78" fill="#2f6b4f"/>
    <text x="95" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Menos de</text>
    <text x="95" y="59" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">6 semanas</text>
    <text x="208" y="33" font-size="19" fill="#444"><tspan font-weight="700">Se quedan con la madre.</tspan></text>
    <text x="208" y="60" font-size="19" fill="#444">Ojos azules, andar torpe: no los retires.</text>
  </g>
  <g transform="translate(30,610)">
    <rect width="740" height="78" rx="12" fill="#ffffff" stroke="#2f6b4f" stroke-width="2"/>
    <rect width="190" height="78" rx="12" fill="#2f6b4f"/><rect x="170" width="20" height="78" fill="#2f6b4f"/>
    <text x="95" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">6 a 8</text>
    <text x="95" y="59" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">semanas</text>
    <text x="208" y="33" font-size="19" fill="#444"><tspan font-weight="700">Retirar para adopción</tspan>: es el mejor</text>
    <text x="208" y="60" font-size="19" fill="#444">momento para acostumbrarlos a la gente.</text>
  </g>
  <g transform="translate(30,700)">
    <rect width="740" height="78" rx="12" fill="#ffffff" stroke="#2f6b4f" stroke-width="2"/>
    <rect width="190" height="78" rx="12" fill="#2f6b4f"/><rect x="170" width="20" height="78" fill="#2f6b4f"/>
    <text x="95" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">2 a 4</text>
    <text x="95" y="59" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">meses</text>
    <text x="208" y="33" font-size="19" fill="#444"><tspan font-weight="700">Valorar con el programa</tspan>:</text>
    <text x="208" y="60" font-size="19" fill="#444">adopción si se dejan tocar.</text>
  </g>
  <g transform="translate(30,790)">
    <rect width="740" height="78" rx="12" fill="#ffffff" stroke="#8a5a17" stroke-width="2"/>
    <rect width="190" height="78" rx="12" fill="#8a5a17"/><rect x="170" width="20" height="78" fill="#8a5a17"/>
    <text x="95" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Más de 4 meses</text>
    <text x="95" y="59" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">sin contacto</text>
    <text x="208" y="33" font-size="19" fill="#444"><tspan font-weight="700">CER y retorno</tspan>: a esa edad ya no</text>
    <text x="208" y="60" font-size="19" fill="#444">se socializan a la fuerza.</text>
  </g>

  <g transform="translate(30,900)">
    <rect width="740" height="110" rx="12" fill="#2f6b4f"/>
    <text x="24" y="40" font-size="21" font-weight="700" fill="#fff">4. Avisa siempre al ayuntamiento o al programa</text>
    <text x="24" y="70" font-size="19" fill="#fff">Anótalo en el censo y planifica el CER de la madre,</text>
    <text x="24" y="96" font-size="19" fill="#fff">para que no haya más camadas.</text>
  </g>
</svg>

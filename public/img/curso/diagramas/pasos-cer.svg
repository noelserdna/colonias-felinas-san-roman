<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1014" width="800" height="1014" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Los seis pasos del CER</title>
  <desc id="d">Pasos del método CER (captura, esterilización y retorno). 1 Planificar: censo de la colonia y cita con la clínica; la víspera se retira la comida, pero nunca el agua. 2 Capturar: jaula trampa que se tapa con una tela al cerrarse; etiquetar cada jaula con colonia, lugar y fecha. 3 En la clínica: leer el chip, esterilizar, marcar la oreja, poner microchip, vacunar y desparasitar. 4 Recuperar: en la jaula, tapado, en un sitio tranquilo, el tiempo que diga el veterinario. 5 Retornar: al mismo sitio donde se capturó, abriendo la jaula para que salga solo. 6 Seguir: anotarlo en el censo, vigilar que se recupere y estar atento a gatos nuevos sin marca. Elaboración propia, CC BY-SA 4.0.</desc>
  <rect width="800" height="1014" fill="#ffffff"/>
  <text x="400" y="46" text-anchor="middle" font-size="30" font-weight="700" fill="#2f6b4f">CER paso a paso</text>
  <text x="400" y="78" text-anchor="middle" font-size="20" fill="#444">Captura, esterilización y retorno</text>
  <path d="M60 144 L60 894" stroke="#2f6b4f" stroke-width="6" stroke-dasharray="2 10" stroke-linecap="round"/>
  <g transform="translate(0,104)">

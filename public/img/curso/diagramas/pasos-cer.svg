    <text x="212" y="42" font-size="24" font-weight="700" fill="#444">Planificar</text>
    <text x="212" y="78" font-size="19" fill="#444">Censo de la colonia y cita con la clínica.</text>
    <text x="212" y="108" font-size="19" fill="#444">La víspera se retira la comida. El agua, nunca.</text>
  </g>
  <g transform="translate(0,254)">
    <rect x="96" y="0" width="674" height="134" rx="14" fill="#eaf3ee" stroke="#2f6b4f" stroke-width="2"/>
    <circle cx="60" cy="40" r="28" fill="#2f6b4f"/><text x="60" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">2</text>
    <g transform="translate(116,35.0)"><rect x="-6" y="-6" width="76" height="76" rx="12" fill="#fff"/><rect x="2" y="16" width="60" height="38" rx="3" fill="#fff" stroke="#444" stroke-width="4"/><path d="M14 18 L14 52" stroke="#444" stroke-width="2.5"/><path d="M24 18 L24 52" stroke="#444" stroke-width="2.5"/><path d="M34 18 L34 52" stroke="#444" stroke-width="2.5"/><path d="M44 18 L44 52" stroke="#444" stroke-width="2.5"/><path d="M54 18 L54 52" stroke="#444" stroke-width="2.5"/><path d="M24 16 C 24 6, 40 6, 40 16" fill="none" stroke="#444" stroke-width="4"/><rect x="46" y="28" width="12" height="8" rx="2" fill="#a8691f"/></g>
    <text x="212" y="42" font-size="24" font-weight="700" fill="#444">Capturar</text>
    <text x="212" y="78" font-size="19" fill="#444">Jaula trampa; al cerrarse, taparla con una tela.</text>
    <text x="212" y="108" font-size="19" fill="#444">Etiquetar cada jaula: colonia, lugar y fecha.</text>
  </g>
  <g transform="translate(0,404)">
    <rect x="96" y="0" width="674" height="134" rx="14" fill="#fbf1e3" stroke="#a8691f" stroke-width="2"/>
    <circle cx="60" cy="40" r="28" fill="#2f6b4f"/><text x="60" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">3</text>
    <g transform="translate(116,35.0)"><rect x="-6" y="-6" width="76" height="76" rx="12" fill="#fff"/><rect x="4" y="4" width="56" height="56" rx="12" fill="#2f6b4f"/><path d="M24 14 H40 V24 H50 V40 H40 V50 H24 V40 H14 V24 H24 Z" fill="#fff"/></g>
    <text x="212" y="42" font-size="24" font-weight="700" fill="#444">En la clínica</text>
    <text x="212" y="78" font-size="19" fill="#444">Leer el chip · esterilizar · marcar la oreja</text>
    <text x="212" y="108" font-size="19" fill="#444">Microchip · vacunas · desparasitar</text>

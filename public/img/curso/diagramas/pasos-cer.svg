    <text x="212" y="42" font-size="24" font-weight="700" fill="#444">Recuperar</text>
    <text x="212" y="78" font-size="19" fill="#444">En la jaula, tapado, en un sitio tranquilo.</text>
    <text x="212" y="108" font-size="19" fill="#444">El tiempo que diga el veterinario.</text>
  </g>
  <g transform="translate(0,704)">
    <rect x="96" y="0" width="674" height="134" rx="14" fill="#eaf3ee" stroke="#2f6b4f" stroke-width="2"/>
    <circle cx="60" cy="40" r="28" fill="#2f6b4f"/><text x="60" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">5</text>
    <g transform="translate(116,35.0)"><rect x="-6" y="-6" width="76" height="76" rx="12" fill="#fff"/><path d="M32 60 C 32 60, 8 36, 8 22 C 8 9, 19 0, 32 0 C 45 0, 56 9, 56 22 C 56 36, 32 60, 32 60 Z" fill="#2f6b4f"/><circle cx="32" cy="22" r="9" fill="#fff"/></g>
    <text x="212" y="42" font-size="24" font-weight="700" fill="#444">Retornar</text>
    <text x="212" y="78" font-size="19" fill="#444">Al mismo sitio donde se capturó.</text>
    <text x="212" y="108" font-size="19" fill="#444">Abrir la jaula y dejar que salga solo.</text>
  </g>
  <g transform="translate(0,854)">
    <rect x="96" y="0" width="674" height="134" rx="14" fill="#eaf3ee" stroke="#2f6b4f" stroke-width="2"/>
    <circle cx="60" cy="40" r="28" fill="#2f6b4f"/><text x="60" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">6</text>
    <g transform="translate(116,35.0)"><rect x="-6" y="-6" width="76" height="76" rx="12" fill="#fff"/><circle cx="32" cy="32" r="27" fill="none" stroke="#2f6b4f" stroke-width="5" stroke-dasharray="120 20"/><path d="M52 6 L60 14 L48 18 Z" fill="#2f6b4f"/><path d="M14 32 C 20 22, 44 22, 50 32 C 44 42, 20 42, 14 32 Z" fill="#fff" stroke="#444" stroke-width="3"/><circle cx="32" cy="32" r="6" fill="#444"/></g>
    <text x="212" y="42" font-size="24" font-weight="700" fill="#444">Seguir</text>
    <text x="212" y="78" font-size="19" fill="#444">Anotarlo en el censo y vigilar que se recupere.</text>
    <text x="212" y="108" font-size="19" fill="#444">Estar atento a gatos nuevos sin marca.</text>
  </g>
</svg>

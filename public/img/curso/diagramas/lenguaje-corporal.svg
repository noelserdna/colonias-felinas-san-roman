<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1122" width="800" height="1122" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Lenguaje corporal del gato</title>
  <desc id="d">Cinco siluetas de gato con sus señales. Relajado: cola baja y suelta, orejas hacia delante, ojos entornados. Alerta o curioso: cola horizontal o algo alzada, orejas tiesas que giran hacia el sonido, ojos muy abiertos. Saludo amistoso: cola en alto con la punta curvada, orejas hacia delante. Miedo: cuerpo agazapado pegado al suelo, cola recogida, orejas aplastadas a los lados, pupilas muy dilatadas. Amenaza defensiva: lomo arqueado y pelo erizado, cola hinchada, orejas hacia atrás, pupilas dilatadas, bufa o gruñe. Consejo: mirar el conjunto; ante miedo o amenaza, alejarse despacio, no mirarlo fijo ni intentar tocarlo. Elaboración propia, CC BY-SA 4.0.</desc>
  <rect width="800" height="1122" fill="#ffffff"/>
  <text x="400" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#2f6b4f">Qué dice el cuerpo del gato</text>
  <text x="400" y="82" text-anchor="middle" font-size="20" fill="#444">Cola, orejas, ojos y postura</text>
  <g transform="translate(20,110)">
    <rect width="370" height="318" rx="14" fill="#eaf3ee" stroke="#2f6b4f" stroke-width="2"/>
    <rect x="224" y="12" width="134" height="32" rx="16" fill="#2f6b4f"/>
    <text x="291" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">✓ Tranquilo</text>
    <line x1="40" y1="200" x2="330" y2="200" stroke="#bbb" stroke-width="2"/>
    <g transform="translate(40,40)" fill="#2f6b4f"><path d="M58 86 C 30 96, 26 132, 36 150 C 40 156, 48 156, 52 152" fill="none" stroke="#2f6b4f" stroke-width="10" stroke-linecap="round"/><path d="M55 92 C 55 66, 90 62, 122 64 C 152 62, 182 62, 190 80 C 196 100, 186 116, 166 118 L 76 118 C 60 116, 54 106, 55 92 Z"/><rect x="64" y="104" width="15" height="56" rx="7"/><rect x="84" y="106" width="14" height="54" rx="7"/><rect x="152" y="104" width="14" height="56" rx="7"/><rect x="170" y="104" width="15" height="56" rx="7"/><path d="M160 66 L188 38 L210 72 L190 100 Z"/><circle cx="204" cy="52" r="23"/><ellipse cx="224" cy="60" rx="11" ry="9"/><path d="M188 40 L191 12 L205 32 Z M206 31 L218 10 L222 40 Z"/><path d="M207 48 Q213 52 219 48 Q213 49.5 207 48 Z" fill="#fff" stroke="#fff" stroke-width="2"/></g>
    <text x="20" y="232" font-size="22" font-weight="700" fill="#444">Relajado</text>
    <text x="20" y="262" font-size="18" fill="#444"><tspan font-weight="700">Cola:</tspan> baja y suelta</text>
    <text x="20" y="287" font-size="18" fill="#444"><tspan font-weight="700">Orejas:</tspan> hacia delante</text>
    <text x="20" y="312" font-size="18" fill="#444"><tspan font-weight="700">Ojos:</tspan> entornados, parpadeo lento</text>
  </g>
  <g transform="translate(410,110)">
    <rect width="370" height="318" rx="14" fill="#eaf3ee" stroke="#2f6b4f" stroke-width="2"/>
    <rect x="224" y="12" width="134" height="32" rx="16" fill="#2f6b4f"/>
    <text x="291" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">✓ Tranquilo</text>
    <line x1="40" y1="200" x2="330" y2="200" stroke="#bbb" stroke-width="2"/>
    <g transform="translate(40,40)" fill="#2f6b4f"><path d="M58 82 C 36 78, 22 72, 10 60" fill="none" stroke="#2f6b4f" stroke-width="10" stroke-linecap="round"/><path d="M55 92 C 55 66, 90 62, 122 64 C 152 62, 182 62, 190 80 C 196 100, 186 116, 166 118 L 76 118 C 60 116, 54 106, 55 92 Z"/><rect x="64" y="104" width="15" height="56" rx="7"/><rect x="84" y="106" width="14" height="54" rx="7"/><rect x="152" y="104" width="14" height="56" rx="7"/><rect x="170" y="104" width="15" height="56" rx="7"/><path d="M160 66 L192 26 L214 60 L190 100 Z"/><circle cx="208" cy="40" r="23"/><ellipse cx="228" cy="48" rx="11" ry="9"/><path d="M192 28 L196 -6 L209 20 Z M210 19 L223 -8 L226 28 Z"/><circle cx="217" cy="36" r="7" fill="#fff"/><circle cx="218" cy="36" r="5.5" fill="#1d2b24"/></g>
    <text x="20" y="232" font-size="22" font-weight="700" fill="#444">Alerta o curioso</text>
    <text x="20" y="262" font-size="18" fill="#444"><tspan font-weight="700">Cola:</tspan> horizontal o algo alzada</text>
    <text x="20" y="287" font-size="18" fill="#444"><tspan font-weight="700">Orejas:</tspan> tiesas, giran al sonido</text>
    <text x="20" y="312" font-size="18" fill="#444"><tspan font-weight="700">Ojos:</tspan> muy abiertos, atentos</text>
  </g>
  <g transform="translate(20,444)">
    <rect width="370" height="318" rx="14" fill="#eaf3ee" stroke="#2f6b4f" stroke-width="2"/>
    <rect x="224" y="12" width="134" height="32" rx="16" fill="#2f6b4f"/>
    <text x="291" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">✓ Tranquilo</text>
    <line x1="40" y1="200" x2="330" y2="200" stroke="#bbb" stroke-width="2"/>
    <g transform="translate(40,40)" fill="#2f6b4f"><path d="M62 80 C 50 60, 52 30, 56 12 C 58 4, 68 2, 72 10" fill="none" stroke="#2f6b4f" stroke-width="10" stroke-linecap="round"/><path d="M55 92 C 55 66, 90 62, 122 64 C 152 62, 182 62, 190 80 C 196 100, 186 116, 166 118 L 76 118 C 60 116, 54 106, 55 92 Z"/><rect x="64" y="104" width="15" height="56" rx="7"/><rect x="84" y="106" width="14" height="54" rx="7"/><rect x="152" y="104" width="14" height="56" rx="7"/><rect x="170" y="104" width="15" height="56" rx="7"/><path d="M160 66 L188 36 L210 70 L190 100 Z"/><circle cx="204" cy="50" r="23"/><ellipse cx="224" cy="58" rx="11" ry="9"/><path d="M188 38 L191 10 L205 30 Z M206 29 L218 8 L222 38 Z"/><ellipse cx="213" cy="46" rx="5" ry="6" fill="#fff"/><ellipse cx="214" cy="46" rx="1.8" ry="4.5" fill="#1d2b24"/></g>
    <text x="20" y="232" font-size="22" font-weight="700" fill="#444">Saludo amistoso</text>
    <text x="20" y="262" font-size="18" fill="#444"><tspan font-weight="700">Cola:</tspan> en alto, punta curvada</text>
    <text x="20" y="287" font-size="18" fill="#444"><tspan font-weight="700">Orejas:</tspan> hacia delante</text>
    <text x="20" y="312" font-size="18" fill="#444"><tspan font-weight="700">Ojos:</tspan> tranquilos</text>
  </g>
  <g transform="translate(410,444)">
    <rect width="370" height="318" rx="14" fill="#fbf1e3" stroke="#a8691f" stroke-width="2"/>
    <rect x="224" y="12" width="134" height="32" rx="16" fill="#a8691f"/>
    <text x="291" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">⚠ Aléjate</text>
    <line x1="40" y1="200" x2="330" y2="200" stroke="#bbb" stroke-width="2"/>
    <g transform="translate(40,40)" fill="#2f6b4f"><g transform="translate(125 160) scale(1.3) translate(-130 -160)"><ellipse cx="186" cy="156" rx="14" ry="5"/><path d="M66 160 C 58 116, 94 94, 138 98 C 170 102, 188 118, 192 140 L 192 160 Z"/><path d="M160 110 L182 114 L204 148 L186 160 Z"/><circle cx="198" cy="128" r="23"/><ellipse cx="218" cy="136" rx="11" ry="9"/><path d="M186 110 L160 92 L202 105 Z M194 106 L182 84 L208 108 Z"/><circle cx="207" cy="124" r="7" fill="#fff"/><circle cx="208" cy="124" r="5.5" fill="#1d2b24"/><path d="M68 150 C 96 150, 130 156, 158 150 C 170 147, 176 140, 172 132" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"/><path d="M68 150 C 96 150, 130 156, 158 150 C 170 147, 176 140, 172 132" fill="none" stroke="#2f6b4f" stroke-width="9" stroke-linecap="round"/></g></g>
    <text x="20" y="232" font-size="22" font-weight="700" fill="#444">Miedo</text>
    <text x="20" y="262" font-size="18" fill="#444"><tspan font-weight="700">Cuerpo:</tspan> agazapado, pegado al suelo</text>
    <text x="20" y="287" font-size="18" fill="#444"><tspan font-weight="700">Orejas:</tspan> aplastadas a los lados</text>
    <text x="20" y="312" font-size="18" fill="#444"><tspan font-weight="700">Ojos:</tspan> pupilas muy dilatadas</text>
  </g>
  <g transform="translate(20,778)">
    <rect width="370" height="318" rx="14" fill="#fbf1e3" stroke="#a8691f" stroke-width="2"/>
    <rect x="224" y="12" width="134" height="32" rx="16" fill="#a8691f"/>
    <text x="291" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">⚠ Aléjate</text>
    <line x1="40" y1="200" x2="330" y2="200" stroke="#bbb" stroke-width="2"/>
    <g transform="translate(40,40)" fill="#2f6b4f"><path d="M60 96 C 36 84, 30 50, 40 18" fill="none" stroke="#2f6b4f" stroke-width="26" stroke-dasharray="4 3" stroke-linecap="round"/><path d="M60 96 C 36 84, 30 50, 40 18" fill="none" stroke="#2f6b4f" stroke-width="18" stroke-linecap="round"/><path d="M52 108 C 48 48, 98 22, 126 22 C 158 22, 196 50, 192 104 C 176 96, 152 88, 124 88 C 96 88, 70 96, 52 108 Z"/><path d="M58 70 C 70 36, 104 16, 126 16 C 152 16, 182 36, 190 64" fill="none" stroke="#2f6b4f" stroke-width="10" stroke-dasharray="3 4"/><rect x="56" y="92" width="14" height="68" rx="7"/><rect x="74" y="94" width="13" height="66" rx="6"/><rect x="160" y="92" width="13" height="68" rx="6"/><rect x="176" y="92" width="14" height="68" rx="7"/><path d="M170 60 L190 72 L212 106 L190 106 Z"/><circle cx="206" cy="86" r="23"/><ellipse cx="226" cy="94" rx="11" ry="9"/><path d="M194 68 L168 50 L210 63 Z M202 64 L190 42 L216 66 Z"/><circle cx="215" cy="82" r="7" fill="#fff"/><circle cx="216" cy="82" r="5.5" fill="#1d2b24"/><path d="M220 96 L238 92 L236 106 Z" fill="#fff"/></g>
    <text x="20" y="232" font-size="22" font-weight="700" fill="#444">Amenaza defensiva</text>
    <text x="20" y="262" font-size="18" fill="#444"><tspan font-weight="700">Lomo:</tspan> arqueado, pelo erizado</text>
    <text x="20" y="287" font-size="18" fill="#444"><tspan font-weight="700">Cola:</tspan> hinchada; orejas atrás</text>
    <text x="20" y="312" font-size="18" fill="#444"><tspan font-weight="700">Ojos:</tspan> dilatados; bufa o gruñe</text>
  </g>
  <g transform="translate(410,778)">
    <rect width="370" height="318" rx="14" fill="#ffffff" stroke="#444" stroke-width="2"/>
    <text x="20" y="42" font-size="22" font-weight="700" fill="#444">Cómo leerlo</text>
    <text x="20" y="80" font-size="18" fill="#444">Mira el conjunto: cola, orejas,</text>
    <text x="20" y="105" font-size="18" fill="#444">ojos y postura, no una sola señal.</text>
    <text x="20" y="150" font-size="18" fill="#444"><tspan font-weight="700">Si ves miedo o amenaza:</tspan></text>
    <text x="20" y="175" font-size="18" fill="#444">• aléjate despacio;</text>
    <text x="20" y="200" font-size="18" fill="#444">• no lo mires fijo;</text>
    <text x="20" y="225" font-size="18" fill="#444">• no intentes tocarlo</text>
    <text x="36" y="250" font-size="18" fill="#444">ni cogerlo.</text>
    <text x="20" y="292" font-size="18" fill="#444">Un parpadeo lento suyo = confianza.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 960" width="800" height="960" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Sexado de gatitos</title>
  <desc id="d">Zona bajo la cola de un gatito visto desde atrás. Hembra: el ano y la vulva, que es una hendidura alargada, están muy juntos, en forma de letra i. Macho: el ano y el orificio redondo del pene están más separados porque entre ambos queda el escroto, en forma de dos puntos. Elaboración propia, CC BY-SA 4.0.</desc>
  <rect width="800" height="960" fill="#ffffff"/>
  <text x="400" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#2f6b4f">¿Macho o hembra?</text>
  <text x="400" y="82" text-anchor="middle" font-size="20" fill="#444">Gatito visto desde atrás, con la cola levantada</text>
  <g transform="translate(30,110)">
    <rect width="740" height="350" rx="14" fill="#ffffff" stroke="#2f6b4f" stroke-width="2.5"/>
    <rect width="740" height="50" rx="14" fill="#2f6b4f"/><rect y="30" width="740" height="20" fill="#2f6b4f"/>
    <text x="24" y="34" font-size="24" font-weight="700" fill="#fff">HEMBRA</text>
    <text x="716" y="34" text-anchor="end" font-size="20" fill="#fff">forma de «<tspan font-weight="700" font-size="26">i</tspan>»</text>
    <g transform="translate(20,52)">
      <path d="M120 112 C 112 80, 108 40, 118 12" fill="none" stroke="#444" stroke-width="34" stroke-linecap="round"/>
      <path d="M120 112 C 112 80, 108 40, 118 12" fill="none" stroke="#e9dfcf" stroke-width="30" stroke-linecap="round"/>
      <ellipse cx="54" cy="262" rx="36" ry="30" fill="#e9dfcf" stroke="#444" stroke-width="2"/>
      <ellipse cx="186" cy="262" rx="36" ry="30" fill="#e9dfcf" stroke="#444" stroke-width="2"/>
      <path d="M120 96 C 62 96, 26 150, 34 216 C 40 262, 84 280, 120 276 C 156 280, 200 262, 206 216 C 214 150, 178 96, 120 96 Z" fill="#e9dfcf" stroke="#444" stroke-width="2.5"/>
      <path d="M104 100 C 110 94, 130 94, 136 100" fill="none" stroke="#e9dfcf" stroke-width="6"/>
      <ellipse cx="120" cy="178" rx="44" ry="66" fill="#f6efe4"/>
      <circle cx="120" cy="146" r="8" fill="#2b2b2b"/>
      <ellipse cx="120" cy="178" rx="4" ry="13" fill="#2b2b2b"/>
      <path d="M132 146 L 250 146 L 290 70" fill="none" stroke="#444" stroke-width="2"/><circle cx="132" cy="146" r="3" fill="#444"/><text x="298" y="77" font-size="21" font-weight="700" fill="#444">Ano</text><text x="298" y="102" font-size="18" fill="#444">arriba, bajo la cola</text><path d="M132 178 L 250 178 L 290 150" fill="none" stroke="#444" stroke-width="2"/><circle cx="132" cy="178" r="3" fill="#444"/><text x="298" y="157" font-size="21" font-weight="700" fill="#444">Vulva</text><text x="298" y="182" font-size="18" fill="#444">hendidura alargada (│)</text>
      <path d="M166 146 L176 146 L176 178 L166 178" fill="none" stroke="#a8691f" stroke-width="3"/><text x="298" y="235" font-size="21" font-weight="700" fill="#8a5a17">Muy juntos</text><text x="298" y="260" font-size="18" fill="#444">casi pegados, sin nada en medio</text><path d="M180 162 L 290 228" stroke="#a8691f" stroke-width="2" stroke-dasharray="5 4"/>
    </g>
  </g>
  <g transform="translate(30,480)">
    <rect width="740" height="350" rx="14" fill="#ffffff" stroke="#8a5a17" stroke-width="2.5"/>
    <rect width="740" height="50" rx="14" fill="#8a5a17"/><rect y="30" width="740" height="20" fill="#8a5a17"/>
    <text x="24" y="34" font-size="24" font-weight="700" fill="#fff">MACHO</text>
    <text x="716" y="34" text-anchor="end" font-size="20" fill="#fff">forma de «<tspan font-weight="700" font-size="26">:</tspan>»</text>
    <g transform="translate(20,52)">
      <path d="M120 112 C 112 80, 108 40, 118 12" fill="none" stroke="#444" stroke-width="34" stroke-linecap="round"/>
      <path d="M120 112 C 112 80, 108 40, 118 12" fill="none" stroke="#e9dfcf" stroke-width="30" stroke-linecap="round"/>
      <ellipse cx="54" cy="262" rx="36" ry="30" fill="#e9dfcf" stroke="#444" stroke-width="2"/>
      <ellipse cx="186" cy="262" rx="36" ry="30" fill="#e9dfcf" stroke="#444" stroke-width="2"/>
      <path d="M120 96 C 62 96, 26 150, 34 216 C 40 262, 84 280, 120 276 C 156 280, 200 262, 206 216 C 214 150, 178 96, 120 96 Z" fill="#e9dfcf" stroke="#444" stroke-width="2.5"/>
      <path d="M104 100 C 110 94, 130 94, 136 100" fill="none" stroke="#e9dfcf" stroke-width="6"/>
      <ellipse cx="120" cy="178" rx="44" ry="66" fill="#f6efe4"/>
      <circle cx="120" cy="140" r="8" fill="#2b2b2b"/>
      <ellipse cx="108" cy="182" rx="13" ry="16" fill="#eadcc6" stroke="#444" stroke-width="1.5"/>
      <ellipse cx="132" cy="182" rx="13" ry="16" fill="#eadcc6" stroke="#444" stroke-width="1.5"/>
      <circle cx="120" cy="222" r="6.5" fill="#2b2b2b"/>
      <path d="M132 140 L 250 140 L 290 52" fill="none" stroke="#444" stroke-width="2"/><circle cx="132" cy="140" r="3" fill="#444"/><text x="298" y="59" font-size="21" font-weight="700" fill="#444">Ano</text><text x="298" y="84" font-size="18" fill="#444">arriba, bajo la cola</text><path d="M144 182 L 250 182 L 290 118" fill="none" stroke="#444" stroke-width="2"/><circle cx="144" cy="182" r="3" fill="#444"/><text x="298" y="125" font-size="21" font-weight="700" fill="#444">Escroto</text><text x="298" y="150" font-size="18" fill="#444">bolsa de los testículos</text><path d="M132 222 L 250 222 L 290 184" fill="none" stroke="#444" stroke-width="2"/><circle cx="132" cy="222" r="3" fill="#444"/><text x="298" y="191" font-size="21" font-weight="700" fill="#444">Pene</text><text x="298" y="216" font-size="18" fill="#444">orificio redondo (•)</text>
      <path d="M166 140 L182 140 L182 222 L166 222" fill="none" stroke="#a8691f" stroke-width="3"/><text x="298" y="262" font-size="21" font-weight="700" fill="#8a5a17">Más separados</text><text x="298" y="287" font-size="18" fill="#444">el escroto queda en medio</text><path d="M186 190 L 290 254" stroke="#a8691f" stroke-width="2" stroke-dasharray="5 4"/>
    </g>
  </g>
  <text x="30" y="872" font-size="19" fill="#444"><tspan font-weight="700">Consejo:</tspan> levanta la cola con suavidad, sin forzar.</text>
  <text x="30" y="900" font-size="19" fill="#444">En gatitos muy pequeños cuesta verlo: compara con sus hermanos.</text>
  <text x="30" y="928" font-size="19" fill="#444">Ante la duda, lo confirma el veterinario.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 834" width="800" height="834" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Marca en la oreja de los gatos esterilizados</title>
  <desc id="d">Dos cabezas de gato vistas de frente con la punta de una oreja cortada en recto. Macho: se marca la oreja izquierda del gato, que al mirarlo de frente queda a tu derecha. Hembra: se marca la oreja derecha del gato, que al mirarlo de frente queda a tu izquierda. El corte se hace con el gato anestesiado durante la esterilización y se ve de lejos. Es la regla habitual en muchos municipios españoles; el lado lo fija cada programa y puede variar. Elaboración propia, CC BY-SA 4.0.</desc>
  <defs>
    <marker id="fa" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a8691f"/></marker>
  </defs>
  <rect width="800" height="834" fill="#ffffff"/>
  <text x="400" y="46" text-anchor="middle" font-size="30" font-weight="700" fill="#2f6b4f">La marca en la oreja</text>
  <text x="400" y="78" text-anchor="middle" font-size="20" fill="#444">Corte recto de la punta: gato ya esterilizado</text>
  <g transform="translate(20,104)">
    <rect width="370" height="560" rx="14" fill="#ffffff" stroke="#2f6b4f" stroke-width="2.5"/>
    <rect width="370" height="54" rx="14" fill="#2f6b4f"/><rect y="34" width="370" height="20" fill="#2f6b4f"/>
    <text x="185" y="37" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">MACHO</text>
    <text x="185" y="92" text-anchor="middle" font-size="21" font-weight="700" fill="#444">Oreja IZQUIERDA del gato</text>
    <text x="185" y="118" text-anchor="middle" font-size="18" fill="#444">a tu derecha si lo miras de frente</text>
    <path d="M253 128 L253 150" stroke="#a8691f" stroke-width="4" marker-end="url(#fa)"/>

      <path d="M92 150 C 100 136, 124 136, 130 150 C 124 162, 100 162, 92 150 Z" fill="#b7c46a" stroke="#444" stroke-width="2.5"/><ellipse cx="111" cy="150" rx="3.5" ry="10" fill="#222"/>
      <path d="M170 150 C 176 136, 200 136, 208 150 C 200 162, 176 162, 170 150 Z" fill="#b7c46a" stroke="#444" stroke-width="2.5"/><ellipse cx="189" cy="150" rx="3.5" ry="10" fill="#222"/>
      <path d="M138 188 L162 188 L150 202 Z" fill="#c98b8b" stroke="#444" stroke-width="2" stroke-linejoin="round"/>
      <path d="M150 202 L150 214 M150 214 C 142 224, 130 222, 126 214 M150 214 C 158 224, 170 222, 174 214" fill="none" stroke="#444" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M118 200 L50 190 M118 208 L52 214 M182 200 L250 190 M182 208 L248 214" stroke="#444" stroke-width="1.8" stroke-linecap="round"/></g>
    <text x="110" y="450" text-anchor="middle" font-size="18" fill="#444">su derecha</text>
    <text x="260" y="450" text-anchor="middle" font-size="18" fill="#444">su izquierda</text>
    <path d="M60 462 L160 462 M210 462 L310 462" stroke="#999" stroke-width="2"/>
    <text x="185" y="502" text-anchor="middle" font-size="18" fill="#444">(gato mirándote de frente)</text>
    <text x="185" y="534" text-anchor="middle" font-size="19" font-weight="700" fill="#2f6b4f">♂ Macho: oreja izquierda</text>
  </g>
  <g transform="translate(410,104)">
    <rect width="370" height="560" rx="14" fill="#ffffff" stroke="#8a5a17" stroke-width="2.5"/>
    <rect width="370" height="54" rx="14" fill="#8a5a17"/><rect y="34" width="370" height="20" fill="#8a5a17"/>
    <text x="185" y="37" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">HEMBRA</text>
    <text x="185" y="92" text-anchor="middle" font-size="21" font-weight="700" fill="#444">Oreja DERECHA del gato</text>
    <text x="185" y="118" text-anchor="middle" font-size="18" fill="#444">a tu izquierda si lo miras de frente</text>
    <path d="M117 128 L117 150" stroke="#a8691f" stroke-width="4" marker-end="url(#fa)"/>

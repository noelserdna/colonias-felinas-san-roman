  <text x="400" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#2f6b4f">Comida en la colonia</text>
  <text x="400" y="80" text-anchor="middle" font-size="20" fill="#444">Qué sí y qué no</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 866" width="800" height="866" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Qué sí y qué no dar de comer</title>
  <desc id="d">Dos columnas. Sí: pienso seco completo para gatos, que es la base; agua limpia siempre, cambiada cada día; horario fijo, en el mismo sitio y a la misma hora; recoger en unos 30 minutos lo que sobre; comederos limpios. No: leche; restos de comida, sobras, huesos o raspas; carne o pescado crudos; comida de perro; dejar comida en el suelo, que atrae plagas y ensucia. Nota: la comida húmeda solo para medicar, para capturar o si lo indica el veterinario. Elaboración propia, CC BY-SA 4.0.</desc>

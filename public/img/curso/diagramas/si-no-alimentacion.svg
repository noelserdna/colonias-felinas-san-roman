    <text x="104" y="262" font-size="18" fill="#444">cambiada cada día</text>
    <line x1="16" y1="294" x2="354" y2="294" stroke="#2f6b4f" stroke-opacity="0.3" stroke-width="1.5"/>
    <g transform="translate(16,310)"><rect x="-6" y="-6" width="80" height="80" rx="12" fill="#fff"/><g transform="translate(2,2)"><circle cx="32" cy="32" r="27" fill="#fff" stroke="#444" stroke-width="5"/><path d="M32 14 L32 32 L45 40" fill="none" stroke="#444" stroke-width="5" stroke-linecap="round"/></g><circle cx="62" cy="8" r="13" fill="#2f6b4f"/><text x="62" y="15" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">✓</text></g>
